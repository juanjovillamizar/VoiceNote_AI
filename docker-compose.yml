services:
  db:
    image: postgres:16-alpine
    container_name: voicenote_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: voicenote
      POSTGRES_PASSWORD: vnpass
      POSTGRES_DB: voicenotedb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicenote -d voicenotedb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voicenote_backend
    restart: unless-stopped
    environment:
      DATABASE_URL:    postgresql+asyncpg://voicenote:vnpass@db:5432/voicenotedb
      JWT_SECRET:      ${JWT_SECRET:-super-secret-dev-key-change-in-production}
      CLAUDE_API_KEY:  ${CLAUDE_API_KEY:-}
      GEMINI_API_KEY:  ${GEMINI_API_KEY:-}
      GROQ_API_KEY:    ${GROQ_API_KEY:-}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voicenote_frontend
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_MP_PUBLIC_KEY: ${NEXT_PUBLIC_MP_PUBLIC_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: